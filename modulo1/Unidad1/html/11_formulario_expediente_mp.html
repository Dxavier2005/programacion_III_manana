<!DOCTYPE html>

<html>
<head>
    <title>Formulario de Historia Clínica</title>
</head>
<body>
    <p>Formulario de Registro de Historia Clínica</p>
    <form action="procesar.php" method="post">
        <table border="0">
            <tr>
                <th>
                    <label for="nombre">Nombre del Paciente:</label>
                    <input type="text" id="nombre" name="nombre"></th>
                <th>
                    <label for="email">Correo del Paciente:</label>       
                    <input type="email" id="email" name="email">
                </th>
            </tr>
            <tr>
                <th>
                    <label for="fecha">Fecha de Nacimiento:</label>
                    <input type="date" id="fecha" name="fecha">
                </th>
                <th>
                    <label for="color">Color de Identificación (opcional):</label>       
                    <input type="color" id="color" name="color">
            </tr>   
            <tr>
                <th>
                    <label for="telefono">Teléfono de Contacto:</label>
                    <input type="tel" id="telefono" name="telefono">
                </th>
                <th>
                    <label for="numero">Número de Historia Clínica:</label>       
                    <input type="number" id="numero" name="numero">
                </th>    

                <th>
                    <label for="genero">Género:</label>
                    <input type="radio" id="m" name="genero" value="m"><label for="m">Masculino</label>
                    <input type="radio" id="f" name="genero" value="f"><label for="f">Femenino</label>
                </th>
                <th>
                    <label for="pais">País de Procedencia:</label>       
                    <select id="pais" name="pais">
                        <option value="ec">Ecuador</option>
                        <option value="col">Colombia</option>
                        <option value="mx">México</option>
                        <option value="ve">Venezuela</option>
                    </select>
            </tr>

              <th>
                    <label for="comentarios">Observaciones Médicas:</label>
                    <textarea id="comentarios" name="comentarios" rows="10"></textarea>
                </th>
                <th>
                    <input type="checkbox" id="f" name="acepto" required>
                    <label for="acepto">Confirmo que los datos ingresados son correctos</label>
                </th>
                
            </tr>
        
        </table>

        <input type="submit" value="Guardar Historia">
        <input type="reset" value="Limpiar Campos">
</body>
</html>
